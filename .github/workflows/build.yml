name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64, targets: "Sanctuary_VST3 Sanctuary_CLAP Sanctuary_LV2 Sanctuary_Standalone sanctuary-render sanctuary-claphost" }
          - { os: windows-2022, name: windows-x64, targets: "Sanctuary_VST3 Sanctuary_CLAP Sanctuary_Standalone sanctuary-render" }
          - { os: macos-15, name: macos-universal, targets: "Sanctuary_VST3 Sanctuary_CLAP Sanctuary_AU Sanctuary_Standalone sanctuary-render" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            python3-numpy python3-scipy
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'; fi
          if [ "$RUNNER_OS" = "Linux" ]; then GEN='-G Ninja'; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release $EXTRA
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.targets }}
      - name: Smoke test (drone key change, chord progression, benchmark)
        shell: bash
        run: |
          R=$(find build -type f \( -name sanctuary-render -o -name sanctuary-render.exe \) | head -n1)
          "$R" --list-presets
          "$R" tools/testdata/drone-d-g.txt drone.wav --mode drone --tail 8
          "$R" tools/testdata/progression.txt progression.wav --mode play
          "$R" --bench tools/testdata/bench-play.txt --mode play
          "$R" --bench tools/testdata/drone-d-g.txt --mode drone
      - name: Objective checks (peak, DC, clicks, aliasing, crossfade loudness)
        if: runner.os == 'Linux'
        run: |
          python3 tools/analyze/analyze.py stats drone.wav --xfade 12.5,16.5
          python3 tools/analyze/analyze.py stats progression.wav
      - name: CLAP smoke test (load the plugin like a host)
        if: runner.os == 'Linux'
        run: ./build/sanctuary-claphost build/Sanctuary_artefacts/Release/CLAP/Sanctuary.clap tools/testdata/drone-d-g.txt clap.wav
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/Sanctuary
          A=build/Sanctuary_artefacts/Release
          cp -R $A/VST3/Sanctuary.vst3 $A/CLAP/Sanctuary.clap dist/Sanctuary/
          [ -d $A/LV2 ] && cp -R $A/LV2/Sanctuary.lv2 dist/Sanctuary/ || true
          [ -d $A/AU ] && cp -R $A/AU/Sanctuary.component dist/Sanctuary/ || true
          cp -R $A/Standalone/* dist/Sanctuary/
          [ "$RUNNER_OS" = "Linux" ] && cp packaging/linux/install.sh dist/Sanctuary/ || true
          cp LICENSE README.md CREDITS.md dist/Sanctuary/
      - uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-${{ matrix.name }}
          path: dist
